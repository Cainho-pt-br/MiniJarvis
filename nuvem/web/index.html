<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="description" content="Seu assistente de IA, em português, sem complicação.">
<style>
:root {
  --fundo: #f6f7fb; --cartao: #ffffff; --texto: #1c1f2a; --suave: #667085;
  --borda: #e4e7ec; --marca: #4f46e5; --marca-texto: #ffffff; --eu: #eef0ff; --erro: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root { --fundo: #0f1117; --cartao: #181b24; --texto: #eceef4; --suave: #98a2b3;
          --borda: #2a2f3c; --marca: #818cf8; --marca-texto: #0f1117; --eu: #23264a; --erro: #f97066; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--fundo); color: var(--texto); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
.oculto { display: none !important; }

/* entrada */
#entrada { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
.caixa { width: 100%; max-width: 380px; background: var(--cartao); border: 1px solid var(--borda); border-radius: 16px; padding: 28px 22px; }
.caixa h1 { margin: 0 0 4px; font-size: 28px; }
.caixa p { margin: 0 0 20px; color: var(--suave); }
.caixa label { display: block; font-size: 14px; margin: 12px 0 4px; }
.caixa input { width: 100%; padding: 12px; border: 1px solid var(--borda); border-radius: 10px; background: var(--fundo); }
.primario { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 10px; background: var(--marca); color: var(--marca-texto); font-weight: 600; }
.link { background: none; border: 0; color: var(--marca); padding: 0; margin-top: 14px; }
.erro { color: var(--erro); font-size: 14px; min-height: 20px; margin-top: 10px; }

/* app */
#app { height: 100%; display: flex; flex-direction: column; }
header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--borda); background: var(--cartao); }
header strong { font-size: 18px; }
.saldo { margin-left: auto; font-size: 14px; color: var(--suave); }
.icone { background: none; border: 1px solid var(--borda); border-radius: 8px; padding: 6px 10px; color: var(--texto); }
#corpo { flex: 1; display: flex; min-height: 0; }
aside { width: 260px; border-right: 1px solid var(--borda); overflow-y: auto; padding: 12px; background: var(--cartao); }
aside button.conv { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--texto); padding: 8px 10px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
aside button.conv:hover, aside button.conv.ativa { background: var(--eu); }
main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#mensagens { flex: 1; overflow-y: auto; padding: 20px 16px; }
.coluna { max-width: 760px; margin: 0 auto; }
.boas-vindas h2 { margin: 8px 0 4px; }
.boas-vindas p { color: var(--suave); margin: 0 0 18px; }
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.tarefa { text-align: left; background: var(--cartao); border: 1px solid var(--borda); border-radius: 12px; padding: 14px; color: var(--texto); }
.tarefa:hover { border-color: var(--marca); }
.tarefa b { display: block; margin: 4px 0 2px; }
.tarefa span { color: var(--suave); font-size: 14px; }
.msg { margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
.msg.user { background: var(--eu); margin-left: 15%; }
.msg.assistant { background: var(--cartao); border: 1px solid var(--borda); margin-right: 5%; }
.msg.falha { border-color: var(--erro); color: var(--erro); }
form#envio { border-top: 1px solid var(--borda); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--cartao); }
form#envio .coluna { display: flex; gap: 8px; align-items: flex-end; }
form#envio textarea { flex: 1; resize: none; max-height: 200px; padding: 12px; border: 1px solid var(--borda); border-radius: 12px; background: var(--fundo); }
form#envio button { padding: 12px 18px; border: 0; border-radius: 12px; background: var(--marca); color: var(--marca-texto); font-weight: 600; }
form#envio button:disabled { opacity: .5; }
@media (max-width: 720px) {
  aside { position: fixed; inset: 53px 0 0 0; width: auto; z-index: 5; }
  .msg.user { margin-left: 8%; }
}
</style>
</head>
<body>

<section id="entrada" class="oculto">
  <form class="caixa" id="form-entrada">
    <h1>Jarvis</h1>
    <p id="subtitulo">Seu assistente de IA, em português, sem complicação.</p>
    <div id="campo-nome"><label for="nome">Seu nome</label><input id="nome" autocomplete="name"></div>
    <label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required>
    <label for="senha">Senha</label><input id="senha" type="password" minlength="8" autocomplete="current-password" required>
    <button class="primario" id="botao-entrada" type="submit">Criar conta grátis</button>
    <div class="erro" id="erro-entrada"></div>
    <button class="link" type="button" id="alternar">Já tenho conta</button>
  </form>
</section>

<section id="app" class="oculto">
  <header>
    <button class="icone" id="menu" aria-label="Conversas">☰</button>
    <strong>Jarvis</strong>
    <span class="saldo" id="saldo"></span>
    <button class="icone" id="nova">+ Nova</button>
    <button class="icone" id="sair">Sair</button>
  </header>
  <div id="corpo">
    <aside id="lateral" class="oculto"></aside>
    <main>
      <div id="mensagens"><div class="coluna" id="lista"></div></div>
      <form id="envio"><div class="coluna">
        <textarea id="texto" rows="1" placeholder="Escreva o que você precisa…"></textarea>
        <button id="enviar" type="submit">Enviar</button>
      </div></form>
    </main>
  </div>
</section>

<script>
const $ = (s) => document.querySelector(s);
let modoCadastro = true, conversaId = null, tarefas = [], ocupado = false;

async function api(caminho, opcoes = {}) {
  const r = await fetch(caminho, { headers: { "Content-Type": "application/json" }, ...opcoes });
  if (!r.ok) {
    let msg = "Algo deu errado. Tente de novo.";
    try { msg = (await r.json()).detail || msg; } catch {}
    if (typeof msg !== "string") msg = "Confira os dados digitados.";
    const e = new Error(msg); e.status = r.status; throw e;
  }
  return r.json();
}

function mostrarEntrada() { $("#app").classList.add("oculto"); $("#entrada").classList.remove("oculto"); }
function mostrarSaldo(c) { $("#saldo").textContent = `${c} créditos`; }

$("#alternar").onclick = () => {
  modoCadastro = !modoCadastro;
  $("#campo-nome").classList.toggle("oculto", !modoCadastro);
  $("#botao-entrada").textContent = modoCadastro ? "Criar conta grátis" : "Entrar";
  $("#alternar").textContent = modoCadastro ? "Já tenho conta" : "Quero criar uma conta";
  $("#erro-entrada").textContent = "";
};

$("#form-entrada").onsubmit = async (ev) => {
  ev.preventDefault();
  const corpo = { email: $("#email").value, senha: $("#senha").value };
  if (modoCadastro) corpo.nome = $("#nome").value || $("#email").value.split("@")[0];
  try {
    const u = await api(modoCadastro ? "/api/cadastro" : "/api/entrar", { method: "POST", body: JSON.stringify(corpo) });
    iniciar(u);
  } catch (e) { $("#erro-entrada").textContent = e.message; }
};

$("#sair").onclick = async () => { await api("/api/sair", { method: "POST" }); location.reload(); };
$("#nova").onclick = () => { conversaId = null; boasVindas(); };
$("#menu").onclick = () => $("#lateral").classList.toggle("oculto");

async function iniciar(u) {
  $("#entrada").classList.add("oculto"); $("#app").classList.remove("oculto");
  mostrarSaldo(u.creditos);
  if (window.innerWidth > 720) $("#lateral").classList.remove("oculto");
  tarefas = await api("/api/tarefas");
  boasVindas(u.nome);
  carregarConversas();
}

function boasVindas(nome) {
  const lista = $("#lista"); lista.innerHTML = "";
  const div = document.createElement("div"); div.className = "boas-vindas";
  const h = document.createElement("h2"); h.textContent = nome ? `Olá, ${nome.split(" ")[0]}! Como posso ajudar?` : "Como posso ajudar?";
  const p = document.createElement("p"); p.textContent = "Escolha uma ideia abaixo ou escreva do seu jeito.";
  const grade = document.createElement("div"); grade.className = "grade";
  for (const t of tarefas) {
    const b = document.createElement("button"); b.className = "tarefa"; b.type = "button";
    b.innerHTML = `<div></div><b></b><span></span>`;
    b.children[0].textContent = t.icone; b.children[1].textContent = t.titulo; b.children[2].textContent = t.descricao;
    b.onclick = () => { const ta = $("#texto"); ta.value = t.prompt; ta.focus(); ajustar(); };
    grade.appendChild(b);
  }
  div.append(h, p, grade); lista.appendChild(div);
}

async function carregarConversas() {
  const convs = await api("/api/conversas");
  const lat = $("#lateral"); lat.innerHTML = "";
  for (const c of convs) {
    const b = document.createElement("button"); b.className = "conv" + (c.id === conversaId ? " ativa" : "");
    b.textContent = c.titulo; b.onclick = () => abrirConversa(c.id);
    lat.appendChild(b);
  }
}

async function abrirConversa(id) {
  const c = await api(`/api/conversas/${id}`);
  conversaId = id; $("#lista").innerHTML = "";
  for (const m of c.mensagens) adicionar(m.papel, m.texto);
  if (window.innerWidth <= 720) $("#lateral").classList.add("oculto");
  carregarConversas();
}

function adicionar(papel, texto) {
  const boas = $(".boas-vindas"); if (boas) boas.remove();
  const d = document.createElement("div"); d.className = `msg ${papel}`; d.textContent = texto;
  $("#lista").appendChild(d); $("#mensagens").scrollTop = $("#mensagens").scrollHeight;
  return d;
}

function ajustar() { const ta = $("#texto"); ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 200) + "px"; }
$("#texto").addEventListener("input", ajustar);
$("#texto").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && window.innerWidth > 720) { e.preventDefault(); $("#envio").requestSubmit(); }
});

$("#envio").onsubmit = async (ev) => {
  ev.preventDefault();
  const texto = $("#texto").value.trim();
  if (!texto || ocupado) return;
  ocupado = true; $("#enviar").disabled = true;
  $("#texto").value = ""; ajustar();
  adicionar("user", texto);
  const resposta = adicionar("assistant", "…");
  let recebido = "";
  try {
    const r = await fetch("/api/mensagens", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto, conversa_id: conversaId }) });
    if (!r.ok) { let d = "Algo deu errado."; try { d = (await r.json()).detail; } catch {}
      if (r.status === 401) return mostrarEntrada(); throw new Error(d); }
    const leitor = r.body.getReader(); const dec = new TextDecoder(); let buffer = "";
    while (true) {
      const { value, done } = await leitor.read(); if (done) break;
      buffer += dec.decode(value, { stream: true });
      let i;
      while ((i = buffer.indexOf("\n\n")) >= 0) {
        const bloco = buffer.slice(0, i); buffer = buffer.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(bloco)?.[1]; const dados = JSON.parse(/^data: (.*)$/m.exec(bloco)?.[1] ?? "null");
        if (ev === "conversa") conversaId = dados.id;
        else if (ev === "texto") { recebido += dados; resposta.textContent = recebido; $("#mensagens").scrollTop = $("#mensagens").scrollHeight; }
        else if (ev === "fim") mostrarSaldo(dados.creditos);
        else if (ev === "erro") throw new Error(dados);
      }
    }
    carregarConversas();
  } catch (e) {
    resposta.classList.add("falha"); resposta.textContent = e.message;
  } finally { ocupado = false; $("#enviar").disabled = false; }
};

api("/api/eu").then(iniciar).catch(mostrarEntrada);
</script>
</body>
</html>
